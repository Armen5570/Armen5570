<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800"
     height="450"
     viewBox="0 0 800 450">

  <defs>
    <filter id="blackGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur">
        <animate attributeName="stdDeviation"
                 values="3;10;3"
                 dur="2s"
                 repeatCount="indefinite"/>
      </feGaussianBlur>

      <feFlood flood-color="#000000" result="black"/>
      <feComposite in="black" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <image
    x="0"
    y="0"
    width="800"
    height="450"
    xlink:href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Playing_T-Rex_Runner.gif"
    filter="url(#blackGlow)"
    preserveAspectRatio="xMidYMid meet"
  />

</svg>
